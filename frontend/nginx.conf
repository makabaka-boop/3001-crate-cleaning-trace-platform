server { listen 80; server_name _; root /usr/share/nginx/html; index index.html;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; }
  location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
}
